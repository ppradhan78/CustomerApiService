spring.application.name=NorthwindCustomerApiService

spring.datasource.url= jdbc:sqlserver://localhost:49771;encrypt=true;trustServerCertificate=true;databaseName=NORTHWND
spring.datasource.username= admin
spring.datasource.password= admin@2025

#spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#spring.jpa.show-sql=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
server.port=8080

#Order Service Base Uri
order.service.url=http://localhost:8081/api/orders/
order.service.timeout=5000
#logging.level.root=DEBUG
# Global level
logging.level.root=INFO

# Reduce Spring noise
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.apache=WARN

spring.main.banner-mode=off
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.zaxxer.hikari=WARN

# Enable rate limiter instance
resilience4j.ratelimiter.instances.getHierarchyRateLimiter.limitForPeriod=1
resilience4j.ratelimiter.instances.getHierarchyRateLimiter.limitRefreshPeriod=60s
resilience4j.ratelimiter.instances.getHierarchyRateLimiter.timeoutDuration=0



